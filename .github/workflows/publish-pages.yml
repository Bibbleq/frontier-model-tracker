name: Publish data

# The repository is authoritative. This publishes the generated outputs and
# immutable snapshots to a stable, independently consumable URL.

# The catalogue watcher's machine commits to observations/, checkpoints/ and
# status/ trigger this job, which replays them into the catalogue product
# (scripts/build_catalogue.py) and publishes it under catalogue/. The output is
# published, never committed. The validation job's include list still leaves
# those folders out.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "requirements.txt"
      - "generated/**"
      - "published/**"
      - "observations/**"
      - "checkpoints/**"
      - "status/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Run invariant tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild from source
        run: python scripts/build.py

      - name: Refuse to publish stale generated files
        run: git diff --exit-code -- generated/

      - name: Assemble site
        run: python scripts/assemble_site.py _site

      # Replays every region's chain from its seed checkpoint and fails if a
      # file does not reach the state the watcher hashed.
      - name: Build the catalogue
        run: python scripts/build_catalogue.py _site

      - name: Verify the published tree matches the manifest
        run: python scripts/check_published_tree.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages sometimes asks for the artifact a second after the upload
      # finishes and is told there is none ("No artifacts named github-pages
      # were found"), as on the 20 November 19:30 and 21 November 01:30
      # snapshots. One retry after a pause, so the site does not stay stale
      # until the next snapshot. A second failure still fails the job.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
