name: Publish data

# The repository is authoritative. This publishes the generated outputs and
# immutable snapshots to a stable, independently consumable URL.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "requirements.txt"
      - "generated/**"
      - "published/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Run invariant tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild from source
        run: python scripts/build.py

      - name: Refuse to publish stale generated files
        run: git diff --exit-code -- generated/

      - name: Assemble site
        run: python scripts/assemble_site.py _site

      - name: Verify the published tree matches the manifest
        run: python scripts/check_published_tree.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
