name: Validate dataset

on:
  push:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "generated/**"
      - "published/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "generated/**"
      - "published/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/validate-data.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Run invariant tests
        run: python -m unittest discover -s tests -v
      - name: Validate and build
        run: python scripts/build.py
      - name: Ensure generated files are committed
        run: git diff --exit-code -- generated/
      - name: Assemble published contract
        run: python scripts/assemble_site.py _site
      - name: Verify published contract
        run: python scripts/check_published_tree.py _site
