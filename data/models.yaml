# Canonical model registry.
#
# Events reference models by stable `id`. Display names, vendor attribution and
# Microsoft-specific naming live here, so an event never has to guess whether
# "GPT-5.3 Chat" and "GPT-5.3 Instant" are the same thing.
#
# `aliases` capture every other name a model is published under, including
# Microsoft or GitHub display names that differ from the vendor's. They exist
# so contributors and importers can resolve a name to an ID.
#
# `families` group models announced or marketed together. An event about a
# family sets `model_claim: family` and lists the member IDs, which keeps
# family announcements queryable without pretending each member was
# individually sourced.

version: 1

