# Canonical model registry.
#
# Events reference models by stable `id`. Display names, vendor attribution and
# Microsoft-specific naming live here, so an event never has to guess whether
# "GPT-5.3 Chat" and "GPT-5.3 Instant" are the same thing.
#
# `aliases` capture every other name a model is published under, including
# Microsoft or GitHub display names that differ from the vendor's. They exist
# so contributors and importers can resolve a name to an ID.
#
# `families` group models announced or marketed together. An event about a
# family sets `model_claim: family` and lists the member IDs, which keeps
# family announcements queryable without pretending each member was
# individually sourced.
#
# `generations` are the broader named or numbered eras within a vendor series: GPT-5.1
# is part of the GPT-5 generation, for example. `model_lines` are recurring
# named branches within a series, such as Claude Sonnet or Claude Opus. Neither
# field implies technical ancestry or supersession.
#
# `modality` says what a model produces or processes: text, image, audio,
# voice or video. Absent means text, and the generated models.csv resolves
# the default so consumers never apply it themselves.
#
# `scope` separates the frontier record from the deep catalogue. Absent means
# frontier. `extended` marks models recorded for completeness — point releases
# and catalogue entries a default view should hide — so breadth of capture
# never has to trade against clutter. Scope is presentation guidance only; an
# extended model's events meet the same evidence bar as any other.
#
# `variant_of` and `variant_kind` mark a distinct API identity that belongs
# with another model: GPT-5.4 mini with GPT-5.4, a reasoning deployment with
# its base model. A variant is registered as its own model with its own
# aliases, events and lifecycle, so each Foundry API name maps to exactly one
# id; the link only groups them, one level deep, within one vendor.

